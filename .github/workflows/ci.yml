name: Validate autonomous engine
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - run: node src/cli.mjs --bots 12 --ticks 100 --json > /tmp/vertice.json
      - run: node src/experiment-cli.mjs --bots 6 --ticks 20 --replicates 2 > /tmp/vertice-experiment.json
      - run: npm run verify
      - run: node src/echo-cli.mjs --bots 6 --ticks 20 --json > /tmp/vertice-echo.json
